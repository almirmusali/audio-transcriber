<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Транскрибер">
<meta name="theme-color" content="#0b0f1a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Транскрибер</title>
<style>
  :root{
    --bg:#0b0f1a; --panel:#131a2a; --panel2:#1a2236; --line:#243049;
    --fg:#e8edf7; --dim:#8d9bb5; --accent:#6ea8fe; --accent2:#3b82f6;
    --rec:#ef4444; --ok:#34d399;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--fg);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    overscroll-behavior-y:contain}
  body{padding:max(12px,env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
  h1{font-size:19px; margin:4px 0 14px; display:flex; align-items:center; gap:8px}
  h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
  h1 .dot.on{background:var(--ok)}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px}
  .row{display:flex; gap:10px; align-items:center}
  .row.wrap{flex-wrap:wrap}
  button,select,input,textarea{font:inherit; color:inherit}
  button{background:var(--panel2); border:1px solid var(--line); color:var(--fg);
    border-radius:12px; padding:11px 14px; touch-action:manipulation; cursor:pointer}
  button:active{transform:scale(.98)}
  button[disabled]{opacity:.4}
  button.primary{background:var(--accent2); border-color:var(--accent2); font-weight:600}
  button.ghost{background:transparent}
  select{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; -webkit-appearance:none; appearance:none}
  .rec-wrap{display:flex; flex-direction:column; align-items:center; gap:12px; padding:6px 0 2px}
  .rec{width:120px;height:120px;border-radius:50%; border:none;
    background:linear-gradient(160deg,#ef4444,#b91c1c); color:#fff; font-size:15px; font-weight:600;
    box-shadow:0 10px 30px rgba(239,68,68,.28); display:flex; align-items:center; justify-content:center;
    position:relative}
  .rec.recording{background:linear-gradient(160deg,#1f2937,#111827); box-shadow:0 0 0 0 rgba(239,68,68,.6);
    animation:pulse 1.6s infinite}
  .rec .sq{width:30px;height:30px;border-radius:8px;background:var(--rec)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.45)}70%{box-shadow:0 0 0 22px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
  .timer{font-variant-numeric:tabular-nums; font-size:26px; letter-spacing:.5px}
  .level{width:180px;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
  .level i{display:block;height:100%;background:var(--rec);width:0%;transition:width .08s linear}
  .muted{color:var(--dim); font-size:13px}
  .bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;margin:10px 0 6px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));width:0%;transition:width .25s}
  .out{white-space:pre-wrap; word-wrap:break-word; font-size:16px; line-height:1.5;
    max-height:46vh; overflow:auto; -webkit-overflow-scrolling:touch; margin-top:8px;
    user-select:text; -webkit-user-select:text}
  .out:empty{display:none}
  .chips{display:flex; gap:8px; flex-wrap:wrap}
  .chips button{padding:9px 12px; font-size:14px; border-radius:11px}
  .hist{list-style:none; margin:0; padding:0}
  .hist li{padding:11px 0; border-top:1px solid var(--line); display:flex; gap:10px; align-items:flex-start}
  .hist li:first-child{border-top:none}
  .hist .t{flex:1; min-width:0}
  .hist .n{font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .hist .p{font-size:12px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .hist button{padding:7px 10px; font-size:13px}
  .err{color:#fca5a5; font-size:14px}
  .toast{position:fixed; left:50%; bottom:calc(26px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    background:#1f2937; border:1px solid var(--line); padding:10px 16px; border-radius:12px; font-size:14px;
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:9}
  .toast.show{opacity:1}
  label.sw{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--dim)}
  input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent2)}
  .hide{display:none !important}
</style>
</head>
<body>
<h1><span class="dot" id="dot"></span> Транскрибер</h1>

<div class="card" id="input-card">
  <div class="rec-wrap">
    <button class="rec" id="rec"><span id="recLabel">Записать</span></button>
    <div class="timer" id="timer">0:00</div>
    <div class="level"><i id="level"></i></div>
  </div>
  <div class="row wrap" style="margin-top:14px">
    <button class="ghost" id="pick" style="flex:1">Выбрать файл</button>
    <input type="file" id="file" accept="audio/*,video/*" class="hide">
  </div>
  <div class="row wrap" style="margin-top:12px">
    <select id="lang">
      <option value="auto">Язык: авто</option>
      <option value="ru">Русский</option>
      <option value="en">English</option>
      <option value="id">Bahasa Indonesia</option>
      <option value="uk">Українська</option>
      <option value="kk">Қазақша</option>
      <option value="de">Deutsch</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
    </select>
    <label class="sw"><input type="checkbox" id="fast"> Быстро</label>
  </div>
</div>

<div class="card hide" id="job-card">
  <div class="row"><b id="jobName" style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap"></b>
    <button class="ghost" id="cancel">Стоп</button></div>
  <div class="muted" id="jobStatus">…</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="err hide" id="jobErr"></div>
  <div class="out" id="out"></div>
  <div class="chips hide" id="actions" style="margin-top:12px">
    <button id="copy">Копировать</button>
    <button id="share">Поделиться</button>
    <button id="dlTxt">TXT</button>
    <button id="dlSrt">SRT</button>
  </div>
  <div class="chips hide" id="aiRow" style="margin-top:8px">
    <button data-preset="clean">✨ Почистить</button>
    <button data-preset="summary">📋 Резюме</button>
    <button data-preset="post">✍️ Пост</button>
  </div>
</div>

<div class="card">
  <div class="row"><b style="flex:1">История</b><button class="ghost" id="refresh" style="padding:7px 10px;font-size:13px">Обновить</button></div>
  <ul class="hist" id="hist"></ul>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id)
const store = {
  get: (k, d) => { try { return localStorage.getItem(k) ?? d } catch { return d } },
  set: (k, v) => { try { localStorage.setItem(k, v) } catch {} },
}
let toastTimer
function toast(msg) {
  $('toast').textContent = msg
  $('toast').classList.add('show')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2200)
}
const fmtTime = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`

// ---------- настройки ----------
$('lang').value = store.get('lang', 'auto')
$('fast').checked = store.get('fast', '0') === '1'
$('lang').onchange = () => store.set('lang', $('lang').value)
$('fast').onchange = () => store.set('fast', $('fast').checked ? '1' : '0')

// ---------- запись ----------
let mediaRecorder = null, chunks = [], stream = null, startedAt = 0, tick = null, audioCtx = null, rafId = 0

function pickMime() {
  for (const t of ['audio/mp4', 'audio/mp4;codecs=mp4a.40.2', 'audio/webm;codecs=opus', 'audio/webm'])
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t
  return ''
}

async function startRec() {
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    return toast('Браузер не умеет запись — открой по HTTPS')
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true },
    })
  } catch (e) {
    return toast('Нет доступа к микрофону')
  }
  const mime = pickMime()
  chunks = []
  mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined)
  mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data) }
  mediaRecorder.onstop = onRecStop
  mediaRecorder.start(1000)
  startedAt = Date.now()
  $('rec').classList.add('recording')
  $('recLabel').outerHTML = '<span class="sq" id="recLabel"></span>'
  tick = setInterval(() => { $('timer').textContent = fmtTime((Date.now() - startedAt) / 1000) }, 250)
  meter(stream)
}

function meter(st) {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)()
    const src = audioCtx.createMediaStreamSource(st)
    const an = audioCtx.createAnalyser()
    an.fftSize = 512
    src.connect(an)
    const buf = new Uint8Array(an.frequencyBinCount)
    const loop = () => {
      an.getByteTimeDomainData(buf)
      let peak = 0
      for (const v of buf) peak = Math.max(peak, Math.abs(v - 128))
      $('level').style.width = Math.min(100, (peak / 60) * 100) + '%'
      rafId = requestAnimationFrame(loop)
    }
    loop()
  } catch {}
}

function stopMeter() {
  cancelAnimationFrame(rafId)
  $('level').style.width = '0%'
  try { audioCtx && audioCtx.close() } catch {}
  audioCtx = null
}

function stopRec() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop()
}

function resetRecUi() {
  clearInterval(tick)
  stopMeter()
  $('rec').classList.remove('recording')
  const el = $('recLabel')
  if (el) el.outerHTML = '<span id="recLabel">Записать</span>'
  $('timer').textContent = '0:00'
}

async function onRecStop() {
  const secs = (Date.now() - startedAt) / 1000
  try { stream.getTracks().forEach((t) => t.stop()) } catch {}
  resetRecUi()
  if (!chunks.length || secs < 0.6) return toast('Слишком короткая запись')
  const type = chunks[0].type || 'audio/mp4'
  const ext = type.includes('webm') ? '.webm' : '.m4a'
  const blob = new Blob(chunks, { type })
  const name = 'Запись ' + new Date().toLocaleString('ru-RU').replace(/[:/]/g, '-') + ext
  upload(blob, name, true)
}

$('rec').onclick = () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') stopRec()
  else startRec()
}

// ---------- файл ----------
$('pick').onclick = () => $('file').click()
$('file').onchange = () => {
  const f = $('file').files[0]
  if (f) upload(f, f.name, false)
  $('file').value = ''
}

// ---------- загрузка и слежение ----------
let current = null, es = null

async function upload(blob, name, fromMic) {
  showJob({ name, status: 'uploading' })
  $('jobStatus').textContent = 'Отправка на Mac…'
  const q = new URLSearchParams({
    name, lang: $('lang').value, fast: $('fast').checked ? '1' : '0', mic: fromMic ? '1' : '0',
  })
  try {
    const xhr = new XMLHttpRequest()
    const done = new Promise((res, rej) => {
      xhr.onload = () => (xhr.status === 200 ? res(JSON.parse(xhr.responseText)) : rej(new Error(xhr.responseText)))
      xhr.onerror = () => rej(new Error('Сеть недоступна'))
    })
    xhr.open('POST', '/api/jobs?' + q.toString())
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) $('prog').style.width = Math.round((e.loaded / e.total) * 100) + '%'
    }
    xhr.setRequestHeader('content-type', 'application/octet-stream')
    xhr.send(blob)
    const r = await done
    store.set('job', r.id)
    attach(r.id)
    loadHistory()
  } catch (e) {
    $('jobErr').textContent = 'Не отправилось: ' + e.message
    $('jobErr').classList.remove('hide')
  }
}

function showJob(j) {
  current = j
  $('job-card').classList.remove('hide')
  $('jobName').textContent = j.name || ''
  $('jobErr').classList.add('hide')
  $('actions').classList.add('hide')
  $('aiRow').classList.add('hide')
  $('out').textContent = ''
  $('prog').style.width = '0%'
  $('cancel').classList.remove('hide')
}

const LABELS = {
  queued: 'В очереди', converting: 'Готовлю аудио…', recognizing: 'Распознаю…',
  done: 'Готово', error: 'Ошибка', cancelled: 'Остановлено', uploading: 'Отправка…',
}

function attach(id) {
  if (es) es.close()
  es = new EventSource('/api/jobs/' + id + '/events')
  es.addEventListener('state', (e) => {
    const j = JSON.parse(e.data)
    current = j
    $('jobName').textContent = j.name
    let s = LABELS[j.status] || j.status
    if (j.status === 'queued' && j.queue > 1) s += ` (${j.queue}-й)`
    $('jobStatus').textContent = s
    if (j.status === 'recognizing') $('prog').style.width = (j.progress || 0) + '%'
  })
  es.addEventListener('progress', (e) => {
    const p = JSON.parse(e.data)
    $('prog').style.width = p + '%'
    $('jobStatus').textContent = 'Распознаю… ' + p + '%'
  })
  es.addEventListener('partial', (e) => {
    $('out').textContent = JSON.parse(e.data)
    $('out').scrollTop = $('out').scrollHeight
  })
  es.addEventListener('done', (e) => {
    const j = JSON.parse(e.data)
    current = j
    es.close(); es = null
    finish(j)
  })
  es.onerror = () => { /* браузер сам переподключится */ }
}

function finish(j) {
  $('cancel').classList.add('hide')
  $('prog').style.width = '100%'
  if (j.status === 'error') {
    $('jobStatus').textContent = 'Ошибка'
    $('jobErr').textContent = j.error || 'Неизвестная ошибка'
    $('jobErr').classList.remove('hide')
  } else {
    const mins = j.seconds ? ` · ${fmtTime(j.seconds)} аудио` : ''
    $('jobStatus').textContent = (j.status === 'cancelled' ? 'Остановлено' : 'Готово') +
      ` · ${j.chars || (j.text || '').length} знаков${mins}`
  }
  if (j.text || j.partial) {
    $('out').textContent = j.text || j.partial
    $('actions').classList.remove('hide')
    if (window.__ai) $('aiRow').classList.remove('hide')
  }
  store.set('job', '')
  loadHistory()
}

$('cancel').onclick = async () => {
  if (!current || !current.id) return
  await fetch('/api/jobs/' + current.id + '/cancel', { method: 'POST' })
}

// ---------- действия с результатом ----------
$('copy').onclick = async () => {
  const text = $('out').textContent
  try {
    await navigator.clipboard.writeText(text)
    toast('Скопировано')
  } catch {
    const ta = document.createElement('textarea')
    ta.value = text; document.body.appendChild(ta); ta.select()
    document.execCommand('copy'); ta.remove()
    toast('Скопировано')
  }
}
$('share').onclick = async () => {
  const text = $('out').textContent
  if (navigator.share) { try { await navigator.share({ text }) } catch {} }
  else toast('Поделиться недоступно')
}
$('dlTxt').onclick = () => current && (location.href = '/api/jobs/' + current.id + '/txt')
$('dlSrt').onclick = () => current && (location.href = '/api/jobs/' + current.id + '/srt')

for (const b of $('aiRow').querySelectorAll('button')) {
  b.onclick = async () => {
    if (!current || !current.id) return
    const old = b.textContent
    b.textContent = '…'; b.disabled = true
    try {
      const r = await fetch('/api/jobs/' + current.id + '/ai', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ preset: b.dataset.preset }),
      })
      const d = await r.json()
      if (d.error) throw new Error(d.error)
      $('out').textContent = d.text
      toast('Готово')
    } catch (e) { toast('Не вышло: ' + e.message) }
    finally { b.textContent = old; b.disabled = false }
  }
}

// ---------- история ----------
async function loadHistory() {
  try {
    const r = await fetch('/api/history')
    const d = await r.json()
    const ul = $('hist')
    ul.innerHTML = ''
    if (!d.items.length) {
      ul.innerHTML = '<li class="muted" style="border:none">Пока пусто</li>'
      return
    }
    for (const it of d.items) {
      const li = document.createElement('li')
      const when = new Date(it.createdAt).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
      li.innerHTML = `<div class="t"><div class="n"></div><div class="p"></div></div><button>Открыть</button>`
      li.querySelector('.n').textContent = it.name
      li.querySelector('.p').textContent = when + ' · ' + (it.preview || LABELS[it.status] || '')
      li.querySelector('button').onclick = () => open_(it.id)
      ul.appendChild(li)
    }
  } catch {}
}
$('refresh').onclick = loadHistory

async function open_(id) {
  const r = await fetch('/api/jobs/' + id)
  if (!r.ok) return toast('Не найдено')
  const j = await r.json()
  showJob(j)
  if (j.status === 'done' || j.status === 'error' || j.status === 'cancelled') finish(j)
  else { store.set('job', id); attach(id) }
  window.scrollTo({ top: 0, behavior: 'smooth' })
}

// ---------- старт ----------
;(async () => {
  try {
    const h = await (await fetch('/api/health')).json()
    window.__ai = !!h.ai
    $('dot').classList.add('on')
  } catch { toast('Сервер недоступен') }
  loadHistory()
  const pending = store.get('job', '')
  if (pending) {
    const r = await fetch('/api/jobs/' + pending)
    if (r.ok) {
      const j = await r.json()
      showJob(j)
      if (j.status === 'done' || j.status === 'error' || j.status === 'cancelled') finish(j)
      else attach(pending)
    } else store.set('job', '')
  }
})()

// Вернулись в приложение — обновим состояние (iOS замораживает SSE в фоне).
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && current && current.id &&
      ['queued', 'converting', 'recognizing'].includes(current.status)) attach(current.id)
})
</script>
</body>
</html>
