<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d8bff"/>
      <stop offset="1" stop-color="#9a6cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#241a4d" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Сквиркл-фон -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <!-- Звуковые волны слева -->
    <path d="M 386 300 Q 330 362 386 424" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" opacity="0.95"/>
    <path d="M 372 266 Q 284 362 372 458" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" opacity="0.55"/>
    <!-- Звуковые волны справа -->
    <path d="M 638 300 Q 694 362 638 424" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" opacity="0.95"/>
    <path d="M 652 266 Q 740 362 652 458" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" opacity="0.55"/>

    <!-- Капсула микрофона -->
    <rect x="412" y="214" width="200" height="340" rx="100" fill="#ffffff"/>

    <!-- Держатель (люлька) -->
    <path d="M 344 430 v 40 a 168 168 0 0 0 336 0 v -40" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>

    <!-- Ножка -->
    <rect x="496" y="632" width="32" height="102" rx="16" fill="#ffffff"/>

    <!-- Подставка -->
    <rect x="420" y="726" width="184" height="30" rx="15" fill="#ffffff"/>
  </g>
</svg>
